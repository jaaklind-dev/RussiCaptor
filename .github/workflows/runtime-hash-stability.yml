name: Runtime hash stability

on:
  push:
  pull_request:

jobs:
  replay-hash:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx jest src/services/golden/__tests__/RuntimeHardening-test.ts --runInBand
      - run: npx jest src/services/analytics/__tests__/AnalyticsHashStability-test.ts --runInBand
