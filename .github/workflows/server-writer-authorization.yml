name: Server writer authorization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isolated-postgres-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require isolated PostgreSQL writer authorization
        run: npm run test:writer-authorization
