name: Server writer authorization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isolated-postgres-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-ci-postgres176
      - name: Require isolated PostgreSQL writer authorization
        run: npm run test:writer-authorization
      - name: Stop disposable PostgreSQL
        if: always() && env.RUSSICAPTOR_CI_PG176_STATE != ''
        run: node scripts/ci-postgres176.mjs stop "$RUSSICAPTOR_CI_PG176_STATE"
